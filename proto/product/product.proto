
syntax = "proto3";

package product;

service ProductService {
  rpc GetProduct (GetProductRequest) returns (ProductResponse);

  rpc CheckAndDecreaseStock (DecreaseStockRequest)
      returns (DecreaseStockResponse);
}

message GetProductRequest {
  string pid = 1;
}

message ProductResponse {
  string pid = 1;
  string pname = 2;
  double price = 3;
  int32 quantity = 4;
}

message DecreaseStockRequest {
  string pid = 1;
  int32 quantity = 2;
}

message DecreaseStockResponse {
  bool success = 1;
  string message = 2;
  int32 remaining_quantity = 3;
}
